name: Build Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Bazaaryar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Read Gradle version
        id: gv
        run: echo "v=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '${{ steps.gv.outputs.v }}' }
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BAZAARYAR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signed with DEBUG key, not publishable"
          fi
      - name: Build release APK + AAB
        env:
          BAZAARYAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BAZAARYAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BAZAARYAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bazaaryar-release
          path: |
            Bazaaryar/app/build/outputs/apk/release/*.apk
            Bazaaryar/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
