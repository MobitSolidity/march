# Copy this file to .github/workflows/build-apk.yml (replace the old one) to enable automatic releases.
# It could not be committed there automatically: editing workflows needs the GitHub "workflow" permission.
name: Build & Release March

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

# Needed to create the GitHub Release the in-app updater reads.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Bazaaryar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Read Gradle version
        id: gv
        run: echo "v=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '${{ steps.gv.outputs.v }}' }
      - name: Version (baseVersion + run number)
        id: ver
        run: |
          BASE=$(grep -oP 'val baseVersion = "\K[^"]+' app/build.gradle.kts)
          NAME="$BASE.${{ github.run_number }}"
          CODE=$((1000 + ${{ github.run_number }}))
          echo "MARCH_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "MARCH_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building March $NAME ($CODE)"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "BAZAARYAR_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "BAZAARYAR_KEYSTORE_PASSWORD=$KS_PASS"
              echo "BAZAARYAR_KEY_ALIAS=$K_ALIAS"
              echo "BAZAARYAR_KEY_PASSWORD=$K_PASS"
            } >> "$GITHUB_ENV"
          else
            # A fixed key keeps every build signed the same way, so in-app updates install over the old version.
            echo "::warning::No KEYSTORE_BASE64 secret: signing with the shared CI key (ci/march-ci.jks.b64). Set real secrets before publishing to stores."
            base64 -d ci/march-ci.jks.b64 > "$RUNNER_TEMP/release.jks"
            {
              echo "BAZAARYAR_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "BAZAARYAR_KEYSTORE_PASSWORD=march-ci-2026"
              echo "BAZAARYAR_KEY_ALIAS=march"
              echo "BAZAARYAR_KEY_PASSWORD=march-ci-2026"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK + AAB
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/march-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/march-v${{ steps.ver.outputs.name }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: march-v${{ steps.ver.outputs.name }}
          path: Bazaaryar/dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: March v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          files: |
            Bazaaryar/dist/march-v${{ steps.ver.outputs.name }}.apk
            Bazaaryar/dist/march-v${{ steps.ver.outputs.name }}.aab
